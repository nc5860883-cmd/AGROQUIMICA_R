
services:
  db:
    image: mysql:8.4
    container_name: mysql_bd_react
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_react
      MYSQL_DATABASE: mi_proyecto_db_react
      MYSQL_USER: usuario_django_react
      MYSQL_PASSWORD: django_password_react
    ports:
      - "3308:3306"
    volumes:
      - db_data_react:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_react
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword_react
    depends_on:
      - db

volumes:
  db_data_react:
    name: agroquimica_react_db_data
